# CodeRabbit Configuration for Tabs++
# https://docs.coderabbit.ai/configuration
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
  path_instructions:
    - path: "**/*.js"
      instructions: |
        Follow strict Tabs++ coding standards from AGENTS.md:
        - No dead code (every import used, every export consumed)
        - Use shared listeners (never register chrome API listeners inside functions)
        - Clean up ALL tracking structures on tab/window remove
        - Use Set for O(1) lookups, not Array iteration
        - Pre-build lookup Maps from static data
        - Batch chrome.storage.local.set calls
        - Validate message handler inputs
        - Store timeout/interval IDs and clear on teardown
        - Event delegation for dynamic lists
        - Cache DOM queries
        - Chrome API promises: always error-handle with .catch()
        - Content script injection guard
        - Keep state.js minimal
        - File size boundaries respected
    - path: "services/**.js"
      instructions: |
        These are service modules - keep them focused and single-responsibility.
        Follow the architecture in AGENTS.md strictly.
  tools:
    shellcheck:
      enabled: false
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
chat:
  auto_reply: true
